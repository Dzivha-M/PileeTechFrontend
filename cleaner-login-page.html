<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cleaner Log In | Pilee Tech Group</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login">
    <section class="brand-panel">
      <div class="logo">
        
       <div class="logo">
        <img src="logo.png" alt="Pilee Tech Group">
        </div>
      </div>

      <div class="welcome">
        <h1>Welcome back</h1>
        <h1 class="accent">to Pilee Tech Group</h1>
        
      </div>

      <div class="brand-bar"></div>
    </section>

    <section class="form-panel">
      <form id="loginForm" novalidate>
        <h2>Cleaner log in</h2>
        <p class="subtitle">Enter your email and password to continue.</p>

        <div class="field">
          <label for="email" class="sr-only">Email address</label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
            <input type="email" id="email" placeholder="Email address" autocomplete="email">
          </div>
          <p class="error" id="emailError" role="alert"></p>
        </div>

        <div class="field">
          <label for="password" class="sr-only">Password</label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
            <input type="password" id="password" placeholder="Password" autocomplete="current-password">
            <button type="button" class="toggle" id="togglePassword" aria-label="Show password">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p class="error" id="passwordError" role="alert"></p>
        </div>

        <div class="options">
          <label class="remember">
            <input type="checkbox" id="remember" checked>
            <span>Remember me</span>
          </label>
          <a href="forgot-password.html">Forgot password?</a>
        </div>

        <button type="submit" class="submit">Log in</button>

        
      </form>
    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
