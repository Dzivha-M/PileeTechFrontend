<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Page settings -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pilee Tech Group | Previous Bookings</title>

    <style>
/* ==========================================
   PILEE TECH GROUP
   PREVIOUS BOOKINGS PAGE
   ========================================== */

/* =========================
   GLOBAL STYLES
   ========================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: #111827;
}

.dashboard-container {
    display: flex;
    min-height: 100vh;
    width: 100%;
}

/* =========================
   SIDEBAR
   ========================= */
.sidebar {
    width: 260px;
    min-width: 260px;
    height: 100vh;
    position: sticky;
    top: 0;
    padding: 32px 20px;
    background: #ffffff;
    border-right: 1px solid #e5eaf1;
    overflow-y: auto;
}

/* Profile */
.profile {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 12px 22px;
    border-bottom: 1px solid #e5eaf1;
}

.profile-icon {
    width: 48px;
    height: 48px;
    min-width: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #dceaff;
    color: #1767c8;
    font-size: 23px;
}

.profile-details h3 {
    color: #111827;
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 4px;
}

.profile-details p {
    color: #64748b;
    font-size: 15px;
}

/* Navigation */
.navigation {
    display: flex;
    flex-direction: column;
    margin-top: 24px;
}

.nav-link {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 56px;
    padding: 13px 14px;
    margin-bottom: 14px;
    border-radius: 12px;
    color: #344054;
    background: transparent;
    text-decoration: none;
    font-size: 16px;
    line-height: 1.35;
    transition: background 0.2s, color 0.2s;
}

.nav-icon {
    width: 25px;
    min-width: 25px;
    text-align: center;
    font-size: 20px;
}

.nav-link:hover,
.nav-link.active {
    background: #e6f0ff;
    color: #1258a8;
}

.nav-link.active {
    font-weight: bold;
}

/* Log out: extra space above, no divider line */
.logout {
    margin-top: 24px;
    padding-top: 13px;
    border-top: none;
}

/* =========================
   MAIN CONTENT
   ========================= */
.scheduled-container {
    flex: 1;
    min-width: 0;
    padding: 40px 35px;
}

/* Page heading */
.scheduled-container h1 {
    font-size: 30px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.6px;
}

.page-subtitle {
    color: #64748b;
    font-size: 16px;
    margin-bottom: 22px;
}

.booking-count {
    color: #64748b;
    font-size: 14px;
    margin-bottom: 12px;
}

/* =========================
   PREVIOUS BOOKINGS TABLE
   ========================= */
.table-wrapper {
    width: 100%;
    overflow-x: auto;
    border: 1px solid #e5eaf1;
    border-radius: 14px;
}

.bookings-table {
    width: 100%;
    min-width: 640px;
    border-collapse: collapse;
}

.bookings-table th,
.bookings-table td {
    text-align: left;
    padding: 16px 18px;
    border-bottom: 1px solid #e5eaf1;
    font-size: 15px;
}

.bookings-table th {
    background: #f7f9fc;
    color: #64748b;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.bookings-table tbody tr:last-child td {
    border-bottom: none;
}

.bookings-table tbody tr:hover {
    background: #f7faff;
}

/* Completed badge */
.status-badge {
    display: inline-block;
    padding: 5px 12px;
    border-radius: 999px;
    background: #e6f6ec;
    color: #16a34a;
    font-size: 12px;
    font-weight: 700;
}

/* View rating button */
.view-btn {
    padding: 8px 16px;
    border: 1px solid #1767c8;
    border-radius: 8px;
    background: #e6f0ff;
    color: #1258a8;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
}

.view-btn:hover {
    background: #1767c8;
    color: #ffffff;
}

/* =========================
   RATING POPUP
   ========================= */
.modal-overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(15, 23, 42, 0.55);
    z-index: 50;
}

.modal-overlay.open {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 360px;
    padding: 26px;
    border-radius: 16px;
    background: #ffffff;
    text-align: center;
}

.modal-name {
    font-size: 17px;
    font-weight: 700;
}

.modal-sub {
    color: #64748b;
    font-size: 14px;
    margin-top: 4px;
}

.modal-score {
    font-size: 44px;
    font-weight: 700;
    margin: 12px 0 4px;
    color: #1258a8;
}

.modal-stars {
    color: #f5a623;
    font-size: 26px;
    letter-spacing: 3px;
}

.star-off {
    color: #dfe5ee;
}

.modal-feedback {
    color: #64748b;
    font-size: 14px;
    margin: 14px 0 20px;
    line-height: 1.5;
}

/* =========================
   COMPANY LOGO
   ========================= */
.company-logo {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 150px;
    height: 60px;
    border-radius: 50%;
}

.company-logo img {
    width: 130px;
    height: 130px;
    object-fit: cover;
    border-radius: 50%;
}

/* =========================
   RESPONSIVE DESIGN
   ========================= */
@media (max-width: 900px) {
    .sidebar {
        width: 220px;
        min-width: 220px;
        padding: 25px 12px;
    }

    .scheduled-container {
        padding: 30px 20px;
    }
}

@media (max-width: 600px) {
    .dashboard-container {
        display: block;
    }

    .sidebar {
        position: relative;
        width: 100%;
        min-width: 0;
        height: auto;
        padding: 15px;
        border-right: none;
        border-bottom: 1px solid #e5eaf1;
    }

    .profile {
        padding-bottom: 15px;
        margin-bottom: 15px;
    }

    .navigation {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 0;
    }

    .nav-link {
        flex: 1 1 135px;
        min-height: 0;
        margin-bottom: 0;
        padding: 10px;
        font-size: 12px;
    }

    .logout {
        margin-top: 0;
        padding-top: 10px;
    }

    .scheduled-container {
        padding: 18px 14px;
    }

    .scheduled-container h1 {
        font-size: 24px;
    }
}
    </style>

</head>


<body>

    <!-- DASHBOARD CONTAINER -->
    <div class="dashboard-container">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <!-- User profile (ids kept for your JavaScript) -->
            <div class="profile">

                <div class="profile-icon">👤</div>

                <div class="profile-details">
                    <h3 id="staffName">Name</h3>
                    <p id="staffSurname">Surname</p>
                </div>

            </div>

            <!-- Navigation -->
            <nav class="navigation" aria-label="Dashboard navigation">

                <!-- Dashboard -->
                <a href="DashbordCleaner.html" class="nav-link">
                    <span class="nav-icon" aria-hidden="true">▦</span>
                    <span>Dashboard</span>
                </a>

                <!-- Scheduled bookings -->
                <a href="SCHEDULEDBOOKINGPAGE.html" class="nav-link">
                    <span class="nav-icon" aria-hidden="true">▣</span>
                    <span>Scheduled bookings</span>
                </a>

                <!-- Request supplies -->
                <a href="Request-Supplies.html" class="nav-link">
                    <span class="nav-icon" aria-hidden="true">⚒</span>
                    <span>Request supplies</span>
                </a>

                <!-- Previous bookings (current page) -->
                <a href="PREVIOUSbOOKING.html"
                   class="nav-link active"
                   aria-current="page">
                    <span class="nav-icon" aria-hidden="true">◷</span>
                    <span>Previous bookings</span>
                </a>

                <!-- Report an issue -->
                <a href="ReportPage.html" class="nav-link">
                    <span class="nav-icon" aria-hidden="true">⚑</span>
                    <span>Report an issue</span>
                </a>
                <a href="CleanerSupport.html"
               class="nav-link active"
               aria-current="page">

                <span class="nav-icon" aria-hidden="true">▤</span>
                <span>Support Documents</span>

            </a>

                <!-- Log out -->
                <a href="cleaner-login-page.html" class="nav-link logout">
                    <span class="nav-icon" aria-hidden="true">⇥</span>
                    <span>Log out</span>
                </a>

            </nav>

        </aside>

        <!-- Previous bookings section -->
        <main class="scheduled-container">

            <!-- Page heading -->
            <h1>Previous Booking</h1>
            <p class="page-subtitle">Your completed jobs and the ratings clients gave you.</p>

            <p class="booking-count" id="bookingCount"></p>

            <!-- Previous bookings table -->
            <div class="table-wrapper">
                <table class="bookings-table">
                    <thead>
                        <tr>
                            <th>Client</th>
                            <th>Location</th>
                            <th>House</th>
                            <th>Status</th>
                            <th>Rating</th>
                        </tr>
                    </thead>
                    <tbody id="bookingsBody">
                        <!-- Rows are added by previousbookings.js -->
                    </tbody>
                </table>
            </div>

        </main>

    </div>

    <!-- Rating popup -->
    <div class="modal-overlay" id="ratingModal">
        <div class="modal-box">
            <div class="modal-name" id="modalName"></div>
            <div class="modal-sub" id="modalSub"></div>
            <div class="modal-score" id="modalScore"></div>
            <div class="modal-stars" id="modalStars"></div>
            <p class="modal-feedback" id="modalFeedback"></p>
            <button class="view-btn" id="closeModal" type="button">Close</button>
        </div>
    </div>

    <!-- Link the JavaScript file -->
    <script src="previousbookings.js"></script>
</body>
</html>
